---
---
{%- if page.url == "/index" -%}
{%- assign page_relative_path = "/" -%}
{%- else -%}
{%- assign page_relative_path = page.url -%}
{%- endif -%}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Redirecting&hellip;</title>
  </head>
  <script>
    var lang = navigator.language || navigator.userLanguage;
    var target = "{{site.baseurl}}/en{{page_relative_path}}";
    {% for lang in site.languages %}{%- if lang != site.default_lang -%}
    if (lang.startsWith("{{ lang }}")) {
      target = "{{site.baseurl}}/{{ lang }}{{page_relative_path}}";
    }
    {% endif %}{%- endfor -%}

    location = target;
  </script>
  <h1>Redirecting&hellip;</h1>
</html>
